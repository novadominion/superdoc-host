<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SuperDoc Host</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f4; }
      #frame { display: flex; flex-direction: column; height: 100vh; }
      #toolbar { flex: none; border-bottom: 1px solid #e7e5e4; background: #fff; min-height: 40px; }
      #editor { flex: 1; overflow: auto; }
      #status {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #78716c;
        background: #f5f5f4; z-index: 10;
      }
      #status.hidden { display: none; }
      /* chrome "page": the parent draws the frame; show only the page. */
      html:has(#frame[data-chrome="page"]), html:has(#frame[data-chrome="page"]) body { background: transparent; }
      #frame[data-chrome="page"] #toolbar { display: none; }
      #frame[data-chrome="page"] #editor { padding: 24px 16px 48px; box-sizing: border-box; }
      #frame[data-chrome="page"] .superdoc { justify-content: center; }
      #frame[data-chrome="page"] .superdoc__layers { zoom: var(--page-fit, 1); }
      #frame[data-chrome="page"] .superdoc-page {
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06), 0 2px 12px rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="status">Waiting for document…</div>
    <div id="frame">
      <div id="toolbar"></div>
      <div id="editor"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
